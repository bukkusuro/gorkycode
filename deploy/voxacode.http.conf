server {
    listen 80;
    listen [::]:80;
    server_name voxacode.online www.voxacode.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    include /etc/nginx/snippets/voxacode.proxy.conf;
}
