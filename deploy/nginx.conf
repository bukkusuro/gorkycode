server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/voicetask.crt;
    ssl_certificate_key /etc/nginx/ssl/voicetask.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 2m;

    location = / { return 302 /VoiceTask/; }
    location = /VoiceTask { return 302 /VoiceTask/; }
    location ^~ /VoiceTask/api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
    }
    location ~ /\. { return 404; }
    location /VoiceTask/ {
        alias /opt/voicetask/current/dist/;
        index index.html;
        add_header Cache-Control no-cache;
    }
    location / { return 404; }
}
