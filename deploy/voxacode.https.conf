server {
    listen 80;
    listen [::]:80;
    server_name voxacode.online www.voxacode.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://voxacode.online$request_uri; }
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name voxacode.online;
    ssl_certificate /etc/letsencrypt/live/voxacode.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxacode.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/voxacode.proxy.conf;
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name www.voxacode.online;
    ssl_certificate /etc/letsencrypt/live/voxacode.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxacode.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://voxacode.online$request_uri;
}
